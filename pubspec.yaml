name: wafra_app
description: "Wafra Discount Mobile App for Ministry Employees in Kuwait"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  provider: ^6.1.2
  go_router: ^14.2.0

  # Network & API
  dio: ^5.5.0

  # Location & Geofencing
  geolocator: ^12.0.0
  flutter_local_notifications: ^17.1.2

  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # UI Enhancement & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/wafra_logo.png