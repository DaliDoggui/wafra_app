name: wafra_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Routing
  provider: ^6.1.2
  go_router: ^14.2.0

  # Network & API
  dio: ^5.5.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2

  # Location & Geofencing
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.1.2

  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # UI Enhancement & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/